[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-residual-rl"
version = "0.1.0"
description = "Data-calibrated safe residual RL for industrial robot trajectory compensation"
requires-python = ">=3.10,<3.13"
dependencies = [
  "gymnasium>=1.0,<1.2",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=15,<22",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
rl = ["stable-baselines3>=2.4,<2.7", "torch>=2.3,<2.8"]
graph = ["torch>=2.3,<2.8"]
plot = ["matplotlib>=3.8,<4", "seaborn>=0.13,<1"]
dev = ["pytest>=8,<9", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
